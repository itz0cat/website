<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1330"/>
      <stop offset="1" stop-color="#1d3fa8"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#b9c8f0"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#e59a1f"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- ears -->
  <polygon points="112,250 122,92 232,170" fill="url(#fur)"/>
  <polygon points="400,250 390,92 280,170" fill="url(#fur)"/>
  <polygon points="140,215 146,130 208,176" fill="#f2a6c0"/>
  <polygon points="372,215 366,130 304,176" fill="#f2a6c0"/>

  <!-- head -->
  <ellipse cx="256" cy="268" rx="158" ry="122" fill="url(#fur)"/>

  <!-- coin eyes -->
  <g>
    <circle cx="198" cy="252" r="38" fill="url(#coin)" stroke="#b36b0a" stroke-width="5"/>
    <circle cx="314" cy="252" r="38" fill="url(#coin)" stroke="#b36b0a" stroke-width="5"/>
    <g fill="none" stroke="#5a3200" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path transform="translate(198 252)" d="M10 -14 C4 -22 -16 -20 -14 -8 C-12 4 12 0 14 12 C16 24 -6 26 -12 16 M0 -26 V-20 M0 20 V26"/>
      <path transform="translate(314 252)" d="M10 -14 C4 -22 -16 -20 -14 -8 C-12 4 12 0 14 12 C16 24 -6 26 -12 16 M0 -26 V-20 M0 20 V26"/>
    </g>
  </g>

  <!-- nose + mouth -->
  <polygon points="244,302 268,302 256,317" fill="#f2a6c0"/>
  <path d="M256 317 V328 M256 328 C248 340 234 338 228 330 M256 328 C264 340 278 338 284 330" fill="none" stroke="#2b3a67" stroke-width="5" stroke-linecap="round"/>

  <!-- whiskers -->
  <g stroke="#2b3a67" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="150" y1="304" x2="88" y2="292"/>
    <line x1="150" y1="320" x2="90" y2="326"/>
    <line x1="362" y1="304" x2="424" y2="292"/>
    <line x1="362" y1="320" x2="422" y2="326"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="454" text-anchor="middle" font-family="Arial Black, Helvetica, Arial, sans-serif" font-weight="900" font-size="58" letter-spacing="6" fill="#ffffff">CAT<tspan fill="#ffc857">SELL</tspan></text>
</svg>
